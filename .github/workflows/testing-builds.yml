name: Testing Desktop Builds

on:
    push:
        branches:
            - testing
    workflow_dispatch:

permissions:
    contents: read

jobs:
    metadata:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.build.outputs.version }}
            short_sha: ${{ steps.build.outputs.short_sha }}
            built_at: ${{ steps.build.outputs.built_at }}
        steps:
            - uses: actions/checkout@v4
            - id: build
              shell: bash
              run: |
                  base_version="$(node -p "require('./package.json').version")"
                  build_date="$(date -u +%Y%m%d)"
                  built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  echo "version=${base_version}-nightly.${build_date}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
                  echo "short_sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
                  echo "built_at=${built_at}" >> "$GITHUB_OUTPUT"

    verify:
        needs: metadata
        runs-on: ubuntu-latest
        env:
            MVMNT_BUILD_CHANNEL: nightly
            MVMNT_BUILD_SHA: ${{ github.sha }}
            MVMNT_BUILD_DATE: ${{ needs.metadata.outputs.built_at }}
            MVMNT_NIGHTLY_BUILD_NUMBER: ${{ github.run_number }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm version "${{ needs.metadata.outputs.version }}" --no-git-tag-version --workspaces=false
            - run: npm install
            - name: Report module dependencies and cycles
              run: npm run architecture:modules
            - name: Report module size and type debt
              run: npm run architecture:health
            - name: Check documentation links
              run: npm run docs:check
            - run: npx prettier --write .
            - run: npm run test
            - run: npm run build
            - run: npm run compile

    package:
        needs: [metadata, verify]
        name: Package ${{ matrix.name }}
        runs-on: ${{ matrix.runner }}
        env:
            MVMNT_BUILD_CHANNEL: nightly
            MVMNT_BUILD_SHA: ${{ github.sha }}
            MVMNT_BUILD_DATE: ${{ needs.metadata.outputs.built_at }}
            MVMNT_NIGHTLY_BUILD_NUMBER: ${{ github.run_number }}
            VITE_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_EU_PROJECT_TOKEN }}
            VITE_PUBLIC_POSTHOG_HOST: https://eu.i.posthog.com
            POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
            POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: macOS
                      runner: macos-14
                      command: npm run make:mac
                      artifact_suffix: macOS-universal
                    - name: Windows
                      runner: windows-latest
                      command: npm run make:win
                      artifact_suffix: windows-x64
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm version "${{ needs.metadata.outputs.version }}" --no-git-tag-version --workspaces=false
            - run: npm install
            - run: ${{ matrix.command }}
              env:
                  # Testing artifacts are intentionally unsigned.
                  MVMNT_SKIP_MAC_SIGNING: '1'
            - uses: actions/upload-artifact@v4
              with:
                  name: MVMNT-Nightly-${{ needs.metadata.outputs.version }}-${{ needs.metadata.outputs.short_sha }}-${{ matrix.artifact_suffix }}
                  path: out/make/**/*
                  if-no-files-found: error
