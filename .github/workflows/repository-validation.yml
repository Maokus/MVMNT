name: Repository validation

on:
    push:
        branches:
            - experimental
            - main
    pull_request:
        branches:
            - experimental
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: repository-validation-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - run: npm install
            - run: npx prettier --check .
            - run: npm run test
            - run: npm run build
            - run: npm run compile
            - run: npm run docs:check
