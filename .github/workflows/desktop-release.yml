name: Desktop Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

env:
    MVMNT_BUILD_CHANNEL: stable
    MVMNT_BUILD_SHA: ${{ github.sha }}

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - name: Verify tag matches package version
              shell: bash
              run: |
                  expected="v$(node -p "require('./package.json').version")"
                  test "$GITHUB_REF_NAME" = "$expected" || {
                      echo "Release tag $GITHUB_REF_NAME does not match package version $expected."
                      exit 1
                  }
            - run: npm install
            - name: Report module dependencies and cycles
              run: npm run architecture:modules
            - name: Report module size and type debt
              run: npm run architecture:health
            - name: Check documentation links
              run: npm run docs:check
            - run: npx prettier --write .
            - run: npm run test
            - run: npm run build
            - run: npm run compile

    macos:
        needs: verify
        runs-on: macos-14
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm install
            - run: npm run build
            - run: npm run test:electron
            - run: npm run make:mac
              env:
                  MVMNT_SKIP_MAC_SIGNING: '1'
            - uses: actions/upload-artifact@v4
              with:
                  name: macos-release
                  path: out/make/**/*

    windows:
        needs: verify
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm install
            - run: npm run build
            - run: npm run test:electron
            - name: Prepare signing certificate
              shell: pwsh
              env:
                  CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
              run: |
                  $certificatePath = Join-Path $env:RUNNER_TEMP 'mvmnt-signing.pfx'
                  [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
                  "WINDOWS_CERTIFICATE_FILE=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Append
            - run: npm run make:win
              env:
                  WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
            - uses: actions/upload-artifact@v4
              with:
                  name: windows-release
                  path: out/make/**/*

    release:
        needs: [macos, windows]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/download-artifact@v4
              with:
                  path: artifacts
            - name: Create draft GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.ref_name }}
              run: |
                  gh release create "$TAG" --repo "${{ github.repository }}" --draft --generate-notes
                  find artifacts -type f -print0 | xargs -0 gh release upload "$TAG" --repo "${{ github.repository }}" --clobber
